$kind: http-request
url: "{{baseUrl}}/api/instructor/courses/{{courseId}}/sections"
method: POST
headers:
  Authorization: Bearer {{instructorToken}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "title": ""
    }
scripts:
  - type: afterResponse
    code: pm.test("400 Bad Request", () => pm.response.to.have.status(400));
    language: text/javascript
order: 4000
