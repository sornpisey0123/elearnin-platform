$kind: http-request
url: "{{baseUrl}}/api/instructor/courses/{{courseId}}/publish"
method: POST
headers:
  Authorization: Bearer {{instructorToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("400 Bad Request", () => pm.response.to.have.status(400));
      const body = pm.response.json();
      pm.test("mentions lesson", () => pm.expect(body.detail).to.include("lesson"));
    language: text/javascript
order: 3000
