$kind: http-request
url: "{{baseUrl}}/api/instructor/courses/{{courseId}}/sections/order"
method: PUT
headers:
  Authorization: Bearer {{instructorToken}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "sectionIds": [
        {{sectionId}},
        {{sectionId}}
      ]
    }
scripts:
  - type: afterResponse
    code: pm.test("400 Bad Request", () => pm.response.to.have.status(400));
    language: text/javascript
order: 17000
