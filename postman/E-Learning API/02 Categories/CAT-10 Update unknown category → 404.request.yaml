$kind: http-request
url: "{{baseUrl}}/api/admin/categories/999999999"
method: PUT
headers:
  Authorization: Bearer {{adminToken}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Ghost {{runId}}"
    }
scripts:
  - type: afterResponse
    code: pm.test("404 Not Found", () => pm.response.to.have.status(404));
    language: text/javascript
order: 10000
