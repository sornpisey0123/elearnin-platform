$kind: http-request
url: "{{baseUrl}}/api/admin/categories"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Nope {{runId}}"
    }
scripts:
  - type: afterResponse
    code: pm.test("401 Unauthorized", () => pm.response.to.have.status(401));
    language: text/javascript
order: 8000
