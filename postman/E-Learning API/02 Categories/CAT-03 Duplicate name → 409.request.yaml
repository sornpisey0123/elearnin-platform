$kind: http-request
url: "{{baseUrl}}/api/admin/categories"
method: POST
headers:
  Authorization: Bearer {{adminToken}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Postman Cat {{runId}}"
    }
scripts:
  - type: afterResponse
    code: pm.test("409 Conflict", () => pm.response.to.have.status(409));
    language: text/javascript
order: 3000
