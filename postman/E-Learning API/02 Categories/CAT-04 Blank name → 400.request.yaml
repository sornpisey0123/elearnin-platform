$kind: http-request
url: "{{baseUrl}}/api/admin/categories"
method: POST
headers:
  Authorization: Bearer {{adminToken}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": ""
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("400 Bad Request", () => pm.response.to.have.status(400));
      const body = pm.response.json();
      pm.test("name error", () => pm.expect(body.errors).to.have.property("name"));
    language: text/javascript
order: 4000
