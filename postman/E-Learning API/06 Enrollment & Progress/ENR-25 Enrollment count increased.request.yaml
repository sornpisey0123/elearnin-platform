$kind: http-request
url: "{{baseUrl}}/api/courses/{{courseSlug}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("200 OK", () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test("2 enrollments", () => pm.expect(body.enrollmentCount).to.eql(2));
    language: text/javascript
order: 25000
