$kind: http-request
url: "{{keycloakUrl}}/realms/{{realm}}/protocol/openid-connect/token"
method: POST
headers:
  Content-Type: application/x-www-form-urlencoded
body:
  type: urlencoded
  content:
    grant_type: password
    client_id: "{{tokenClientId}}"
    username: "{{student2Username}}"
    password: "{{student2Password}}"
    scope: openid email profile
scripts:
  - type: afterResponse
    code: |-
      pm.test("200 OK", () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test("has access_token", () => pm.expect(body.access_token).to.be.a("string"));
      pm.environment.set("student2Token", body.access_token);
    language: text/javascript
order: 6000
