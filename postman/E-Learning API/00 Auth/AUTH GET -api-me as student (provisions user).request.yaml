$kind: http-request
name: AUTH GET /api/me as student (provisions user)
url: "{{baseUrl}}/api/me"
method: GET
headers:
  Authorization: Bearer {{studentToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("200 OK", () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test("role is STUDENT", () => pm.expect(body.role).to.eql("STUDENT"));
      pm.environment.set("studentUserId", body.id);
    language: text/javascript
order: 10000
