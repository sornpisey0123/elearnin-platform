$kind: http-request
url: "{{baseUrl}}/api/admin/users/{{adminUserId}}/status"
method: PATCH
headers:
  Authorization: Bearer {{adminToken}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "active": false
    }
scripts:
  - type: afterResponse
    code: pm.test("403 Forbidden", () => pm.response.to.have.status(403));
    language: text/javascript
order: 9000
