$kind: http-request
url: "{{baseUrl}}/api/me/password"
method: PUT
headers:
  Authorization: Bearer {{studentToken}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "currentPassword": "whatever",
      "newPassword": "NewPass@123",
      "confirmPassword": "Other@123"
    }
scripts:
  - type: afterResponse
    code: pm.test("400 Bad Request", () => pm.response.to.have.status(400));
    language: text/javascript
order: 5000
