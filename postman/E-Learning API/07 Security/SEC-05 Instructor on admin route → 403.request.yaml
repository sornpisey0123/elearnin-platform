$kind: http-request
url: "{{baseUrl}}/api/admin/categories/{{categoryId}}"
method: PUT
headers:
  Authorization: Bearer {{instructorToken}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Hijack"
    }
scripts:
  - type: afterResponse
    code: pm.test("403 Forbidden", () => pm.response.to.have.status(403));
    language: text/javascript
order: 4000
