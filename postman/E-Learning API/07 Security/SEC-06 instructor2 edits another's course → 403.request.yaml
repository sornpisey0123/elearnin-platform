$kind: http-request
url: "{{baseUrl}}/api/instructor/courses/{{courseId}}"
method: PUT
headers:
  Authorization: Bearer {{instructor2Token}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "title": "Hijacked {{runId}}",
      "description": "Created by the Postman collection",
      "categoryId": {{categoryId}},
      "level": "BEGINNER",
      "price": 49.99
    }
scripts:
  - type: afterResponse
    code: pm.test("403 Forbidden", () => pm.response.to.have.status(403));
    language: text/javascript
order: 5000
