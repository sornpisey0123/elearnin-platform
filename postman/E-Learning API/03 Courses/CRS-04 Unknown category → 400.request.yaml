$kind: http-request
url: "{{baseUrl}}/api/instructor/courses"
method: POST
headers:
  Authorization: Bearer {{instructorToken}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "title": "Ghost {{runId}}",
      "description": "Created by the Postman collection",
      "categoryId": 999999999,
      "level": "BEGINNER",
      "price": 49.99
    }
scripts:
  - type: afterResponse
    code: pm.test("400 Bad Request", () => pm.response.to.have.status(400));
    language: text/javascript
order: 4000
